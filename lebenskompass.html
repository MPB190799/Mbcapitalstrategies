<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MB Lebenskompass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #080810; --card-bg: #12121C; --text: #EAEAEA; --gold: #D4AF37; --border: rgba(212, 175, 55, 0.3); }
        body { background-color: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; user-select: none; -webkit-user-select: none; }
        .kompass-wrap { width: 100%; max-width: 800px; height: 95vh; background: var(--card-bg); border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.6), 0 0 0 1px var(--border); display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .header { padding: 25px; text-align: center; border-bottom: 1px solid var(--border); background: rgba(8, 8, 16, 0.9); z-index: 2; flex-shrink: 0;}
        .logo-title { font-size: 22px; font-weight: 700; letter-spacing: 3px; color: var(--gold); text-transform: uppercase; margin: 0;}
        .sub-date { font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #8a8aa0; margin-top: 6px; }

        /* Tabs */
        .tabs { display: flex; justify-content: center; gap: 20px; padding: 15px 0 25px 0; cursor: pointer;}
        .tab-btn { font-family: 'IBM Plex Mono', monospace; background: none; border: 1px solid transparent; color: #8a8aa0; padding: 8px 24px; border-radius: 30px; font-size: 13px; text-transform: uppercase; transition: all 0.3s ease; cursor: pointer;}
        .tab-btn.active { background: rgba(212, 175, 55, 0.1); color: var(--gold); border-color: var(--border);}

        /* Canvas for writing */
        .paper-area { flex-grow: 1; position: relative; background-image: radial-gradient(circle at 4px 4px, rgba(255,255,255,0.03) 1px, transparent 0); background-size: 24px 24px;}
        canvas { width: 100%; height: 100%; touch-action: none; cursor: crosshair; }

        /* Overlays (Goals, Tracker) */
