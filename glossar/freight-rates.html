      "name": "Was sind Frachtraten (Freight Rates)?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Frachtraten sind die Preise für den Transport von Gütern auf Schiffen. Sie werden täglich am Markt zwischen Reedereien (Angebot) und Verladern (Nachfrage) ausgehandelt und können je nach Schiffstyp stark schwanken."
      }
    },
    {
      "@type": "Question",
      "name": "Wie beeinflussen Frachtraten die Dividende von Schifffahrtsaktien?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Höhere Frachtraten bedeuten mehr Umsatz und freien Cashflow für Reedereien — das ermöglicht höhere variable Dividenden. Bei Spot-Tankern kann die Dividende zwischen 2% und 15% p.a. variieren, je nach Marktlage."
      }
    },
    {
      "@type": "Question",
      "name": "Was ist der Baltic Dry Index und wie ist er mit Frachtraten verknüpft?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Der Baltic Dry Index (BDI) misst die Durchschnittsfrachtraten für Trockenladungsschiffe (Bulker). Er gilt als Frühindikatoren für die globale Handelsnachfrage. Steigt der BDI, profitieren Dry-Bulk-Reedereien wie Star Bulk überproportional."
      }
    }
  ]
