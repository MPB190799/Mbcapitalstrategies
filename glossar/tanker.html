    {"@type": "Question", "name": "Wie zyklisch sind Tanker-Aktien?", "acceptedAnswer": {"@type": "Answer", "text": "Sehr zyklisch: TCE-Raten können 5x schwanken (Tief $12.000 zu Hoch $60.000/Tag). Aktienpreise folgen. Geopolitik (Sanktionen, Routen-Umwege) und OPEC-Fördermengen sind Haupt-Treiber. Investment-These: langfristig strukturelle Nachfrage, taktisch Zyklen nutzen."}},
    {
        "@type": "Question",
        "name": "Was ist der Unterschied zwischen Rohöltanker und Produktentanker?",
        "acceptedAnswer": {
            "@type": "Answer",
            "text": "Rohöltanker (VLCC, Suezmax, Aframax) transportieren unraffiniertes Erdöl von Förderregionen zu Raffinerien. Produktentanker (MR, LR1, LR2) transportieren raffinierte Produkte wie Diesel, Benzin und Kerosin von Raffinerien zu Verbrauchern. Produktentanker haben strengere Tankbeschichtungsanforderungen und fahren oft kürzere, aber vielfältigere Routen."
        }
    },
    {
        "@type": "Question",
        "name": "Welche Faktoren beeinflussen Tankerdividenden am stärksten?",
        "acceptedAnswer": {
            "@type": "Answer",
            "text": "Die drei wichtigsten Faktoren sind: (1) Spotmarkt-Dayrates (hohe Raten = hohe variable Dividenden bei Unternehmen wie TORM und Hafnia), (2) Schiffsalter und Wartungskosten (ältere Flotten kosten mehr im Drydock), (3) Ölproduktionsvolumen und Handelsströme (Sanktionen gegen Russland/Iran verändern Routen und schaffen Tonnen-Meilen-Wachstum)."
        }
    },
    {
        "@type": "Question",
        "name": "Wie lange dauert typischerweise ein Tanker-Zyklus?",
        "acceptedAnswer": {
            "@type": "Answer",
            "text": "Tanker-Zyklen dauern typischerweise 7-10 Jahre von Tief zu Tief. Ein Zyklus beginnt mit niedrigen Raten, die zu minimalen Neubestellungen führen. Nach 2-3 Jahren sinkt das Überangebot, Raten steigen, Bestellungen nehmen zu. Neue Schiffe werden 2-3 Jahre später ausgeliefert, drücken wieder die Raten. Das Verständnis dieser Zyklik ist entscheidend für langfristige Tanker-Investments."
        }
    }
