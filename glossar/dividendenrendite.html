  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Wie berechnet man die Dividendenrendite?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Die Dividendenrendite = Jahres-Dividende ÷ aktueller Aktienkurs × 100. Beispiel: 2 € Dividende bei 40 € Kurs = 5,0% Rendite."
      }
    },
    {
      "@type": "Question",
      "name": "Was ist ein guter Wert für die Dividendenrendite?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Eine Dividendenrendite von 3–8% gilt bei Qualitätsaktien als attraktiv. Werte über 10% können auf hohes Risiko oder einen Dividendencut hindeuten."
      }
    },
    {
      "@type": "Question",
      "name": "Was ist der Unterschied zwischen Dividendenrendite und YOC?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "YOC (Yield on Cost) zeigt die Rendite auf den ursprünglichen Kaufkurs. Bei steigenden Dividenden wächst YOC jedes Jahr — die aktuelle Dividendenrendite zeigt dagegen den Ist-Stand zum Marktpreis."
      }
    },
    {
      "@type": "Question",
      "name": "Was ist eine gute Dividendenrendite für Aktien?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Allgemein gilt: 2-4% = niedrig (typisch für Wachstumsaktien wie Microsoft/Apple), 4-6% = moderat (z.B. Versorger, große REITs), 6-9% = hoch (Pipeline-MLPs, Energie-Aktien, Tanker), >9% = sehr hoch (BDCs, zyklische Tanker-Peaks, spezielle Situationen). Marcos Qualitätsschwelle: ≥8% YOC auf den persönlichen Einstiegskurs für Hard-Asset-Aktien. Wichtig: Eine zu hohe Rendite (>15%) ohne klaren Geschäftsmodell-Grund ist oft ein Warnsignal für drohende Dividendenkürzung."
      }
    },
    {
      "@type": "Question",
      "name": "Wie berechne ich die Dividendenrendite bei mehreren Käufen (Durchschnittskurs)?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Bei mehreren Käufen zu unterschiedlichen Kursen: Durchschnittlichen Einstiegskurs berechnen (Gesamtinvestition ÷ Gesamtanzahl Aktien). Dann: YOC = Aktuelle Jahresdividende ÷ Durchschnittlicher Einstiegskurs × 100. Beispiel: Kauf 100 Aktien à 30€ + 100 Aktien à 20€ = 200 Aktien für 5.000€ = Ø 25€ Einstand. Bei 2€ Dividende = YOC 8%. Für präzise Berechnung nutze den kostenlosen YOC-Rechner (mbcapitalstrategies.com/tools/yield-on-cost-rechner.html)."
      }
    },
    {
      "@type": "Question",
      "name": "Warum fällt der Aktienkurs nach der Dividendenzahlung?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Am Ex-Dividenden-Tag fällt der Aktienkurs theoretisch um den Betrag der Dividende, weil der Wert aus dem Unternehmen abfließt. Beispiel: Aktie bei 50€, Dividende 2€ → Kurs fällt auf ~48€ am Ex-Tag. Das ist KEIN Verlust, wenn du die Dividende erhältst — du hast 48€ + 2€ Cash = 50€ Gesamtvermögen. Wichtig: Kauf AM Ex-Tag = keine Dividende mehr (Anspruch sichert man durch Kauf vor dem Ex-Tag)."
      }
    }
  ]
}
