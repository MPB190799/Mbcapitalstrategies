    {"@type": "Question", "name": "Was sind Charterraten und wie werden sie berechnet?", "acceptedAnswer": {"@type": "Answer", "text": "Charterraten sind der Tagespreis für die Miete eines Schiffes (in USD/Tag). Time-Charter-Equivalent (TCE) = Spotrate minus Hafenkosten und Bunker. TCE ermöglicht vergleichbare Profitabilitätsanalyse."}},
    {"@type": "Question", "name": "Wie wirken sich Charterraten auf Tanker-Dividenden aus?", "acceptedAnswer": {"@type": "Answer", "text": "Bei variablen Dividenden (TORM, Frontline, CMB.Tech) = Dividende ≈ FCF ÷ Aktien. Hohe Charterraten → hoher FCF → hohe Dividende. In schwachen Märkten können Dividenden stark fallen oder ausgesetzt werden."}},
    {"@type": "Question", "name": "Was ist der Unterschied zwischen Spot- und Time-Charter?", "acceptedAnswer": {"@type": "Answer", "text": "Spot-Charter = kurzfristige Anmietung (1 Fahrt oder 30–90 Tage), höheres Gewinnpotenzial bei starkem Markt. Time-Charter = langfristig (1–5 Jahre), fixer Tagessatz, niedrigeres Risiko aber begrenzte Upside."}},
    {"@type": "Question", "name": "Welche Charterraten gelten 2026 für Tanker und Bulk Carrier?", "acceptedAnswer": {"@type": "Answer", "text": "Aktuelle Charterraten 2026 (Näherungswerte, Q2 2026): VLCC (Very Large Crude Carrier) = 25.000–40.000 $/Tag TCE; Suezmax (Rohöl) = 20.000–35.000 $/Tag; Aframax = 18.000–28.000 $/Tag; MR-Tanker (Produkte) = 14.000–22.000 $/Tag; VLGC (LPG) = 30.000–50.000 $/Tag; Capesize Bulk Carrier = 12.000–25.000 $/Tag; Panamax Bulk = 10.000–18.000 $/Tag. Quellen: Baltic Exchange, Clarkson Platou, Quartalsberichte der Reedereien."}},
