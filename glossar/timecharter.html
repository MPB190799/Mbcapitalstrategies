      "@type": "Question",
      "name": "Was ist eine Time-Charter?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Time-Charter (TC) ist ein langfristiger Mietvertrag für ein Schiff über 1–5+ Jahre zu fester Dayrate. Der Charterer zahlt täglich den vereinbarten Satz. Vorteil: Planungssicherheit für Reeder und Charterer."
      }
    },
    {
      "@type": "Question",
      "name": "Was ist der Unterschied zwischen Time-Charter und Bare-Boat-Charter?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Time-Charter: Reeder stellt Schiff mit Crew und Betrieb. Bare-Boat-Charter: Charterer mietet nur das Schiff (ohne Crew) und übernimmt volle Verantwortung. Bare-Boat ist für Finanzierungen und langfristige Projekte üblich."
      }
    },
    {
      "@type": "Question",
      "name": "Wie beeinflusst eine höhere TC-Coverage die Dividendenstabilität?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Mehr Time-Charter = stabilere, planbare Einnahmen = verlässlichere Dividende. Reedereien mit 50–70% TC-Coverage sind weniger zyklisch. Reine Spot-Spieler (voll variabel) wie TORM zahlen höhere Dividenden in Boom-Jahren, aber weniger in Abschwüngen."
      }
    },
    {
      "@type": "Question",
      "name": "Was ist der Unterschied zwischen Timecharter und Spotcharter?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Timecharter: fester Tagessatz für 6 Monate bis 5 Jahre. Reeder hat Einkommenssicherheit, Charterer hat Schiffsverfügbarkeit. Spotcharter (Voyage Charter): Einzelreise zu aktuellen Marktpreisen. Höhere Volatilität, aber bei steigenden Raten deutlich lukrativer. Für Dividendeninvestoren: TC-lastiger Reeder (z.B. FLEX LNG: 96% TC-Coverage) zahlt stabile Dividenden. Spot-lastiger Reeder (z.B. Frontline/TORM) zahlt variable Dividenden — im Boom sehr hoch, im Abschwung niedrig."
      }
    },
    {
      "@type": "Question",
      "name": "Wie berechnet man die TCE-Rate (Time Charter Equivalent)?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "TCE-Formel: (Voyage-Erlöse minus Reisekosten) / Anzahl der Reisetage. Beispiel: Tanker verdient $1,5 Mio. pro Reise (15 Tage) mit $200.000 Bunkerkosten und Hafengebühren → TCE = ($1.500.000 - $200.000) / 15 = $86.667/Tag. Die TCE macht Spot- und TC-Verträge vergleichbar, indem variable Reisekosten eliminiert werden. Börsenkurse von Tanker-Aktien korrelieren stark mit Bewegungen der TCE-Raten — Baltic Dirty Tanker Index (BDTI) und BCTI als tägliche Referenz."
      }
    },
    {
      "@type": "Question",
      "name": "Welche Schifffahrtsaktien haben den höchsten Timecharter-Anteil?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Hoher TC-Anteil (stabile Dividenden): FLEX LNG (~96% TC, mehrjährige Verträge mit Top-LNG-Konzern), Höegh Autoliners (~85% TC, Car Carrier), Nordic American Tankers (~30-40% TC Mix). Hoher Spotanteil (variable Dividenden): Frontline (~60% Spot), TORM (~40-50% Spot), CMB.Tech (Mix je nach Marktsituation). Marcos Bewertung: Für Dividendenstabilität ist TC-Coverage wichtig — aber pure TC-Flotten verpassen Boom-Perioden. Idealer Mix: 50-60% TC als Dividendenboden + Rest Spot für Upside."
      }
    }
