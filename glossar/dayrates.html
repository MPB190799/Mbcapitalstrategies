      "name": "Was sind Charterraten (Dayrates) und wie werden sie berechnet?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Charterraten (Dayrates) sind die Tagesmiete für ein Schiff, ausgedrückt in USD pro Tag. Die TCE-Rate (Time Charter Equivalent) ist die bereinigete Version nach Abzug von Port-Kosten und Brennstoff. TCE-Raten sind der wichtigste Vergleichs-Massstab zwischen Tanker-Unternehmen."
      }
    },
    {
      "@type": "Question",
      "name": "Wie beeinflussen Dayrates die Dividenden von Tankeraktien?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Tankeraktien mit variablen Dividenden-Modellen (TORM, FRO, CMB.Tech) schütten einen festen Prozentsatz des FCF aus. Hohe Dayrates → hoher FCF → hohe Dividende. Bei $50.000+/Tag TCE können Tankeraktien Yields von 15–25% erzielen. Bei $20.000/Tag sinkt die Dividende auf Basisniveau."
      }
    },
    {
      "@type": "Question",
      "name": "Was sind typische Break-even-Raten für VLCC und MR-Tanker?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "VLCC: Break-even liegt bei etwa $25.000–32.000/Tag (je nach Flottengrösse und Finanzierungsstruktur). MR-Tanker (Medium Range): Break-even ca. $15.000–20.000/Tag. LR2-Tanker: $18.000–25.000/Tag. Unternehmen mit Break-evens deutlich unter Spot-Raten haben die grösste Ausschüttungskapazität."
      }
    }
