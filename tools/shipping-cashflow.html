      "name": "Wie berechne ich den Cashflow aus Shipping-Dividenden?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Multipliziere Anzahl Aktien × aktuelle Dividende je Aktie. Bei Quartals-Dividenden (USD) multiplizierst du mit 4 für den Jahres-Cashflow. Der Shipping-Cashflow-Rechner übernimmt die Umrechnung in EUR automatisch."
      }
    },
    {
      "@type": "Question",
      "name": "Welche Tanker-Aktien zahlen die höchsten Dividenden?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Derzeit führen TORM, BW LPG, Dorian LPG und CMB.Tech mit Dividendenrenditen von 8-18%. Die Dividenden sind variabel und hängen von Charter-Raten und Spot-Märkten ab."
      }
    },
    {
      "@type": "Question",
      "name": "Wann werden Shipping-Dividenden gezahlt?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Tanker-Aktien zahlen meist quartalsweise oder halbjährlich. Der Ex-Dividend-Date liegt in der Regel 1-2 Tage vor dem Record Date. Erst wer am Tag VOR dem Ex-Date Aktionär ist, erhält die Dividende."
      }
    }
  ,
    {
          "@type": "Question",
          "name": "Wie berechnet der Shipping-Cashflow-Rechner die Dividende?",
          "acceptedAnswer": {
                "@type": "Answer",
                "text": "Gib TCE-Rate (USD/Tag), Tages-Betriebskosten (OpEx, typisch 8.000-12.000 USD/Tag für moderne Tanker), Schuldendienst, Flottengröße und Aktienzahl ein. Der Rechner zeigt FCF pro Quartal und implizierte Dividende pro Aktie. Ideal zum Stress-Test verschiedener TCE-Szenarien: Was passiert bei VLCC-Raten von 20.000, 30.000 oder 40.000 USD/Tag mit der erwarteten Dividende?"
          }
    },
    {
          "@type": "Question",
          "name": "Was sind typische Betriebskosten für Tanker-Schiffe?",
          "acceptedAnswer": {
                "@type": "Answer",
                "text": "Tages-OpEx (Daily OpEx) für verschiedene Tanker-Typen 2026: VLCC: 10.000-14.000 USD/Tag; Suezmax: 9.000-12.000 USD/Tag; Aframax: 8.500-11.000 USD/Tag; MR-Tanker (Produktentanker): 7.500-10.000 USD/Tag. OpEx umfasst Crew, Schiffsverpflegung, Wartung, Versicherung, Schiffsmanagement und kleinere Reparaturen. Nicht enthalten: Bunker (Treibstoff) und Hafengebühren — diese werden beim Spot-Voyage vom Einnahmen abgezogen bevor TCE berechnet wird."
          }
    },
    {
          "@type": "Question",
          "name": "Wie nutze ich den Shipping-Rechner zur Dividenden-Prognose?",
          "acceptedAnswer": {
                "@type": "Answer",
                "text": "Praxis-Beispiel TORM: Flotte ~80 MR-Tanker, TCE $20.000/Tag, OpEx $9.000/Tag, Schuldendienst $3.000/Tag = $8.000/Tag FCF/Schiff x 80 Schiffe x 90 Tage = $57,6M FCF/Quartal. Bei 120M Aktien = $0,48/Aktie Dividende. Bei 70% Ausschüttungsquote = ~$0,34/Aktie. Vergleiche mit tatsächlicher TORM-Quartalsdividende um dein Modell zu kalibrieren."
