      "@type": "Question",
      "name": "Was macht Schifffahrtsaktien (Shipping-Aktien) als Dividendeninvestment attraktiv?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Schifffahrtsaktien wie Tanker-, Bulker- und LNG-Carrier-Reedereien zahlen in Boom-Phasen der Frachtraten oft 8-20% Dividendenrendite, da viele Reedereien einen Großteil des freien Cashflows direkt ausschütten statt zu reinvestieren. Der Sektor ist stark zyklisch — hohe Renditen entstehen genau dann, wenn Frachtraten (TCE) deutlich über den Betriebskosten liegen."
      }
    },
    {
      "@type": "Question",
      "name": "Wie zyklisch sind Shipping-Dividenden wirklich?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Sehr zyklisch: Spotmarkt-Frachtraten können sich innerhalb weniger Monate verdoppeln oder halbieren (Angebot/Nachfrage, geopolitische Sondersituationen wie Hormuz-Spannungen oder Rotmeer-Umleitungen). Reedereien mit variabler Ausschüttungspolitik (Prozentsatz des Gewinns statt Fixdividende) passen die Dividende entsprechend an — Investoren sollten Schwankungen einkalkulieren, nicht als verlässliches Fixeinkommen erwarten."
      }
    },
    {
      "@type": "Question",
      "name": "Welche Shipping-Segmente gibt es und worin unterscheiden sie sich?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Haupt-Segmente: Tanker (Rohöl/Produkte, z.B. VLCC/Suezmax/Aframax), Bulker (Trockenschüttgut wie Eisenerz/Kohle/Getreide), LNG/LPG-Carrier (Flüssiggas-Transport) und Containerschiffe. Jedes Segment hat eigene Angebots-/Nachfragedynamik — LNG-Carrier profitieren z.B. von langfristigen Charter-Verträgen und sind weniger volatil als Spotmarkt-Tanker."
      }
    }
