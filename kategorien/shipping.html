        "@type": "Answer",
        "text": "Shipping-Aktien sind Aktien von Reedereien, die Tanker, LNG-Carrier, Trockengutschiffe oder Container-Schiffe betreiben. Sie bieten oft 8–15% Dividendenrendite, sind aber konjunkturzyklisch."

      }

        "@type": "Answer",
        "text": "Shipping-Aktien unterteilen sich nach transportiertem Gut: (1) Produkttanker — Raffinierte Ölprodukte (Diesel, Kerosin, Benzin): TORM, Scorpio Tankers, Hafnia. (2) Rohöl-Tanker (VLCC/Suezmax/Aframax) — Rohöl-Transport: DHT Holdings, Nordic American Tankers, Frontline. (3) LPG-Tanker (VLGC) — Flüssiggas (Propan, Butan): Dorian LPG, BW LPG, Navigator Gas. (4) LNG-Tanker — Verflüssigtes Erdgas: FLEX LNG, Golar LNG, CMB.Tech (LNG-Divisionen). (5) Bulk-Carrier — Trockenschüttgut (Eisenerz, Kohle): Golden Ocean, Diana Shipping, Genco. (6) Containerschiffe — Konsumgüter: Hapag-Lloyd, Maersk. MB Capital Strategies fokussiert auf Produkttanker und LPG/LNG."
      }

      "@type": "Question",
      "name": "Wie liest man einen Shipping-Quartalsreport?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Wichtige Punkte beim Lesen eines Shipping-Quartalsreports: (1) TCE-Rate — wie viel hat das Unternehmen pro Tag und Schiff verdient? Vergleich mit Vorquartal und Vorjahr. (2) Flottenauslastung — wie viel Prozent der Schiffe waren im Einsatz? >95% ist sehr gut. (3) EBITDA-Marge — Wie hoch ist die operative Profitabilität? (4) Dividendenankündigung — variable oder fixe Dividende? Höher/niedriger als erwartet? (5) Fleet-Update — neue Schiffe bestellt? Schiffe verkauft? Zeitcharter-Deals abgeschlossen? (6) Outlook — Was erwartet das Management für die nächsten Quartale? (7) Net-Debt-Entwicklung — Schulden aufgebaut oder abgebaut? Diese Kennzahlen gemeinsam ergeben das Bild der Shipping-Aktie."

      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Zwei fundamentale Einnahme-Modelle in der Schifffahrt: (1) Spot-Charter — Schiff wird für eine einzelne Reise zum aktuellen Marktpreis verchartert. Volatil, kann sehr hoch sein (Suez-Krise, Lieferkettenengpässe) aber auch einbrechen. TORM und Dorian LPG nutzen stark den Spot-Markt. (2) Time-Charter (TC) — Schiff wird für 1-5+ Jahre zu einem fixen Tagessatz verchartert. Stabile, vorhersagbare Einnahmen. Niedriger als Spot in Boom-Phasen aber Sicherheit in Abschwüngen. FLEX LNG nutzt primär Langzeit-Time-Charter. (3) Hybrid-Ansatz — Kombination aus Spot und TC für Risiko/Rendite-Balance. P&L-Sichtbarkeit ist bei TC-fokussierten Unternehmen höher und damit die Dividendenprognose verlässlicher."
