name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Gruppenname bewusst NICHT "pages": am 06.08.2026 fror Lauf 31122784430 GitHub-seitig in
# status=waiting ein (Abbruch UND force-cancel antworteten mit HTTP 502) und blockierte damit die
# Gruppe "pages" — die DE-Seite lieferte 57 Stunden lang nichts mehr aus, 22 Commits hingen fest.
# Ein umbenannter Gruppenname umgeht den eingefrorenen Lauf, ohne die Serialisierung aufzugeben.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
